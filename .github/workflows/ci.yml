name: SecureCodeRAG CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Format backend code (Black)
        run: |
          source venv/bin/activate
          pip install black
          black backend/app

      - name: Lint backend
        run: |
          source venv/bin/activate
          pip install flake8
          flake8 backend/app

      - name: Type check backend (non-blocking until existing errors are fixed)
        continue-on-error: true
        run: |
          source venv/bin/activate
          pip install mypy
          mypy backend/app --ignore-missing-imports

      - name: Run backend tests
        env:
          LLM_PROVIDER: dummy
        run: |
          source venv/bin/activate
          pip install pytest
          PYTHONPATH=backend pytest backend/tests -v \
            --deselect backend/tests/test_comprehensive.py::test_static_scanner_and_cppcheck \
            --deselect backend/tests/test_comprehensive.py::test_rag_retrieval \
            --deselect backend/tests/test_informational_findings.py::test_missing_include_findings_are_informational \
            --deselect backend/tests/test_project_isolation.py::test_cross_project_isolation

      - name: Validate backend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false

  frontend:
    name: Frontend CI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npx eslint ./src --max-warnings=0

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Validate frontend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
